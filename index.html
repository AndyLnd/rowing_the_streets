<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Row Row Row</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="statusbar">
    <span class="dot idle" id="dot"></span>
    <span id="statusText">Nicht verbunden</span>
    <span class="spacer"></span>
    <button id="connectBtn" class="primary">Rudergerät verbinden</button>
    <button id="allBtn">Alle Geräte anzeigen</button>
    <button id="disconnectBtn" hidden>Trennen</button>
    <button id="startBtn" hidden>Training starten</button>
    <button id="overviewBtn">Übersicht</button>
    <button id="routeBtn">Route planen</button>
    <button id="streetViewBtn">Street View</button>
    <button id="demoBtn">Demo</button>
  </header>

  <main>
    <div id="map"></div>
    <div id="streetview" hidden></div>
    <section class="hud" id="hud">
      <div class="tile wide" data-key="elapsed"><span class="v">–</span><span class="l">Zeit</span></div>
      <div class="tile wide" data-key="distance"><span class="v">–</span><span class="l">Distanz</span></div>
      <div class="tile wide" data-key="route"><span class="v">–</span><span class="l">Strecke</span></div>
      <div class="tile" data-key="pace"><span class="v">–</span><span class="l">Pace</span></div>
      <div class="tile" data-key="avgPace"><span class="v">–</span><span class="l">Ø Pace</span></div>
      <div class="tile" data-key="strokeRate"><span class="v">–</span><span class="l">Schläge/min</span></div>
      <div class="tile" data-key="strokeCount"><span class="v">–</span><span class="l">Schläge</span></div>
      <div class="tile" data-key="power"><span class="v">–</span><span class="l">Power</span></div>
      <div class="tile" data-key="avgPower"><span class="v">–</span><span class="l">Ø Power</span></div>
      <div class="tile" data-key="calories"><span class="v">–</span><span class="l">Kalorien</span></div>
      <div class="tile" data-key="heartRate"><span class="v">–</span><span class="l">Herzfrequenz</span></div>
      <div class="tile" data-key="met"><span class="v">–</span><span class="l">MET</span></div>
    </section>
  </main>

  <details class="debug">
    <summary>Debug</summary>
    <pre id="log"></pre>
  </details>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
